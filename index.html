<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Power Diagram - ERD Studio</title>
    <script>
      try {
        const t = localStorage.getItem('power-diagram-theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const isDark = !(t === 'light' || (!t && !prefersDark));
        if (isDark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }

        const accents = {
          indigo: { light: 'rgba(79, 70, 229, 0.18)', dark: 'rgba(99, 102, 241, 0.28)' },
          blue: { light: 'rgba(37, 99, 235, 0.18)', dark: 'rgba(59, 130, 246, 0.28)' },
          emerald: { light: 'rgba(5, 150, 105, 0.18)', dark: 'rgba(16, 185, 129, 0.28)' },
          cyan: { light: 'rgba(8, 145, 178, 0.18)', dark: 'rgba(6, 182, 212, 0.28)' },
          violet: { light: 'rgba(124, 58, 237, 0.18)', dark: 'rgba(139, 92, 246, 0.28)' },
          rose: { light: 'rgba(225, 29, 72, 0.18)', dark: 'rgba(244, 63, 94, 0.28)' },
          amber: { light: 'rgba(217, 119, 6, 0.18)', dark: 'rgba(245, 158, 11, 0.28)' },
          teal: { light: 'rgba(13, 148, 136, 0.18)', dark: 'rgba(20, 184, 166, 0.28)' },
          monochrome: { light: 'rgba(24, 24, 27, 0.12)', dark: 'rgba(250, 250, 250, 0.22)' }
        };
        const a = localStorage.getItem('power-diagram-accent');
        if (a && accents[a]) {
          const glow = isDark ? accents[a].dark : accents[a].light;
          document.documentElement.style.setProperty('--splash-glow', glow);
        }

        // Timeout de seguridad por si React tarda en inicializar
        setTimeout(() => {
          const splash = document.getElementById('app-splash');
          if (splash && !splash.classList.contains('splash-fade-out')) {
            splash.classList.add('splash-fade-out');
            setTimeout(() => splash.remove(), 400);
          }
        }, 3500);
      } catch (e) {}
    </script>
    <style>
      :root {
        --splash-bg: #f8fafc;
        --splash-glow: rgba(79, 70, 229, 0.18);
      }

      html.dark {
        --splash-bg: #09090b;
        --splash-glow: rgba(99, 102, 241, 0.28);
      }

      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: var(--splash-bg);
        overflow: hidden;
      }

      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: var(--splash-bg);
        user-select: none;
        -webkit-user-select: none;
        opacity: 1;
        visibility: visible;
        transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      }

      #app-splash.splash-fade-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .splash-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .splash-logo-container {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .splash-logo-glow {
        position: absolute;
        width: 110px;
        height: 110px;
        border-radius: 50%;
        background: var(--splash-glow);
        filter: blur(28px);
        animation: splash-glow-pulse 2.5s ease-in-out infinite alternate;
      }

      .splash-logo {
        position: relative;
        width: 80px;
        height: 80px;
        border-radius: 20px;
        object-fit: contain;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.25), 0 8px 10px -6px rgba(0, 0, 0, 0.15);
        animation: splash-logo-pulse 2.5s ease-in-out infinite;
      }

      @keyframes splash-logo-pulse {
        0%, 100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.03);
        }
      }

      @keyframes splash-glow-pulse {
        0%, 100% {
          opacity: 0.6;
          transform: scale(1);
        }
        50% {
          opacity: 1;
          transform: scale(1.15);
        }
      }
    </style>
  </head>

  <body>
    <!-- Pantalla de carga inicial nativa (Splash Screen) -->
    <div id="app-splash" aria-hidden="true">
      <div class="splash-content">
        <div class="splash-logo-container">
          <div class="splash-logo-glow"></div>
          <img src="/logo.png" alt="Power Diagram" class="splash-logo" />
        </div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
